    <rect x="118" y="84" width="276" height="262" rx="64" fill="#FFFFFF"/>
    <path d="M256 330 V462" stroke="#FFFFFF" stroke-width="40" fill="none"/>
    <path d="M256 140 L330 166 V218 C330 266 299 297 256 314 C213 297 182 266 182 218 V166 Z" fill="none" stroke="#0B4DA2" stroke-width="44"/>
  </g>
